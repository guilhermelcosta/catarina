app-id: org.katarina.Katarina
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: katarina
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home        # campos de arquivo e coleções fora do sandbox
modules:
  - name: katarina
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-flatpak
          - repo
          - .git
