app-id: io.github.guilhermelcosta.Catarina
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: catarina
finish-args:
  - --share=network
  - --share=ipc                        # required with fallback-x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents      # default collections folder
  - --talk-name=org.freedesktop.secrets   # OS secret keychain
  - --talk-name=org.kde.kwalletd6

modules:
  # secret keychain (Secret Service/KWallet) used by the Backend when present
  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.16.0.tar.gz
        sha256: 3be26ec4ae30eecf0c2ff7572ba83799791b157c76e15a05ef35f23dc25e4054

  - name: catarina
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/guilhermelcosta/catarina.git
        tag: v0.2.4
