name: Release proposal

# Keep one pull request from release/x.y.z to master open at all times. Merging
# it is the release decision; release.yml tags the merge.
#
# RELEASE_TOKEN is required. A pull request opened with GITHUB_TOKEN does not
# trigger workflows, so its required checks would never run and the merge would
# stay blocked.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: release-proposal
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    name: release-proposal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN is missing. Create a fine-grained token with Contents and Pull requests write access and save it as a repository secret."
            exit 1
          fi
          user=$(gh api user --jq .login)
          id=$(gh api user --jq .id)
          git config user.name "$user"
          git config user.email "${id}+${user}@users.noreply.github.com"
      - name: Propose the next patch release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 .github/scripts/release_proposal.py
