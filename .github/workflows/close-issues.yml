name: Close linked issues

# GitHub closes an issue from a keyword only when the pull request lands on the
# default branch. Work reaches `master` through a release branch, so the issue
# would stay open for weeks. Close it when the pull request lands on `develop`.

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    name: close-issues
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues the body references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          numbers=$(printf '%s' "$body" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u)
          if [ -z "$numbers" ]; then
            echo "No closing keyword in the pull request body"
            exit 0
          fi
          for number in $numbers; do
            echo "Closing #$number"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --reason completed --comment "Closed by #$PR."
          done
