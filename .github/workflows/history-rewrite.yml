name: History rewrite (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all branches and tags
        run: |
          git fetch --all --tags --prune
          for branch in $(git branch -r | grep -v 'origin/HEAD' | sed 's|origin/||'); do
            git branch --track "$branch" "origin/$branch" 2>/dev/null || true
          done

      - name: Install git-filter-repo
        run: |
          python3 -m pip install --user git-filter-repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Remove factory from all history
        run: |
          git filter-repo --path factory --invert-paths --force
          echo "remaining factory commits:"
          git log --all --oneline -- factory | wc -l

      - name: Push rewritten branches and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force --all origin
          git push --force --tags origin
