name: CI

on:
  # One run per push. A pull request must not trigger the build: the checks for
  # the head commit already come from the push, and the only PR-scoped rule
  # (the issue reference) lives in pull-request.yml.
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(develop|master)$ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^dependabot/ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^(feature|fix|chore|docs|test|refactor|perf|ci|build|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            exit 0
          fi
          echo "::error::Invalid branch name '$BRANCH'. Use <type>/<slug> or release/<x.y.z>."
          exit 1

  secret-scan:
    name: secret-scan
    needs: branch-name
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  build-test:
    name: build-test
    needs: branch-name
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ git make \
            extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            kf6-kirigami-devel qtkeychain-qt6-devel \
            appstream desktop-file-utils
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Install for AppStream validation
        run: cmake --install build --prefix "$PWD/install"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/io.github.guilhermelcosta.Catarina.metainfo.xml
      - name: Validate desktop entry
        run: desktop-file-validate build/io.github.guilhermelcosta.Catarina.desktop
