name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(develop|master)$ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^dependabot/ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^(feature|fix|chore|docs|test|refactor|perf|ci|build|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            exit 0
          fi
          echo "::error::Invalid branch name '$BRANCH'. Use <type>/<slug> or release/<x.y.z>."
          exit 1

  linked-issue:
    name: linked-issue
    needs: branch-name
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require an issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$PR_BRANCH" in
            release/*|dependabot/*)
              echo "Exempt branch: $PR_BRANCH"
              exit 0
              ;;
          esac
          case "$PR_AUTHOR" in
            'dependabot[bot]'|'github-actions[bot]')
              echo "Exempt author: $PR_AUTHOR"
              exit 0
              ;;
          esac
          if grep -qE '(Closes|Fixes|Refs) +#[0-9]+' <<< "$PR_BODY"; then
            echo "Issue reference found"
            exit 0
          fi
          echo '::error::The pull request body must reference an issue: Closes #N'
          exit 1

  secret-scan:
    name: secret-scan
    needs: branch-name
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  build-test:
    name: build-test
    needs: branch-name
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ git make \
            extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            kf6-kirigami-devel qtkeychain-qt6-devel \
            appstream desktop-file-utils
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Install for AppStream validation
        run: cmake --install build --prefix "$PWD/install"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/io.github.guilhermelcosta.Catarina.metainfo.xml
      - name: Validate desktop entry
        run: desktop-file-validate build/io.github.guilhermelcosta.Catarina.desktop

  dependency-review:
    name: dependency-review
    needs: branch-name
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
