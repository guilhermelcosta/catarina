name: CI

# One run per push. A pull request from a branch in this repository does not
# rebuild: the push run already reported the checks on the head commit. A fork
# pull request cannot trigger a push here, so pull-request.yml runs the same
# build jobs for forks.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  branch-name:
    name: branch-name
    # develop and master are valid by definition, and the release pull request
    # takes its checks from the release branch push.
    if: github.ref_name != 'develop' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^dependabot/ ]]; then
            exit 0
          fi
          if [[ "$BRANCH" =~ ^(feature|fix|chore|docs|test|refactor|perf|ci|build|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            exit 0
          fi
          echo "::error::Invalid branch name '$BRANCH'. Use <type>/<slug> or release/<x.y.z>."
          exit 1

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout history without blobs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ git make \
            extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            kf6-kirigami-devel qtkeychain-qt6-devel \
            appstream desktop-file-utils
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Install for AppStream validation
        run: cmake --install build --prefix "$PWD/install"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/io.github.guilhermelcosta.Catarina.metainfo.xml
      - name: Validate desktop entry
        run: desktop-file-validate build/io.github.guilhermelcosta.Catarina.desktop
