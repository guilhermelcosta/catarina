version: 1
timezone: America/Sao_Paulo
repo: catarina
verify: factory/verify.yaml

# ---- gate schema -------------------------------------------------------------
# Every gate has the same shape. No gate is special.
#
# applies_if: all conditions must be true for the gate to run. Default: always.
# mode:
#   human     always stop for a human
#   auto      never stop; the role decides
#   human_if  stop when any `when` condition matches, otherwise auto
#   auto_if   auto when any `when` condition matches, otherwise stop
# when:       conditions for human_if / auto_if
# block_on:   gate failures that return to build, not to the human
#
# A gate that is not listed here does not exist. The orchestrator stops and
# asks instead of guessing.
# -----------------------------------------------------------------------------

models:
  judgment: deepseek/deepseek-flash#max
  execution: deepseek/deepseek-flash#low

limits:
  max_attempts: 2
  max_pr_lines: 400
  max_pr_files: 10
  max_open_prs: 3
  build_timeout_s: 900
  budget_per_task_usd: 5

worktree:
  root: .worktrees
  branch: "factory/<spec-id>/<task-id>"

gates:
  g0:
    applies_if: [new_product, feature_risk_high, revalidation]
    mode: human
  brief:
    mode: human
  spec:
    mode: human
  design:
    mode: human_if
    when: [new_dependency, schema, auth, payment, infra, secrets]
  qa:
    mode: auto
  validate:
    mode: auto
    require_evidence: true
    allow_partial_for_risk: [low]
  ui_review:
    applies_if: [touches_ui]
    mode: auto
    block_on: [generic_pattern, missing_empty_state, missing_error_state, contrast_fail, no_direction]
  merge:
    mode: human
    # After 5 clean merges, switch to:
    # mode: auto_if
    # when: [risk_low, qa_pass, validate_pass, review_approve, scope_clean, verify_yaml_unchanged]
  close:
    applies_if: [own_pr_only]
    mode: auto

escalate_if:
  - touches: [auth, payment, migrations, infra, secrets, packaging]
  - pr_lines_gt: 400
  - attempts_gt: 2
  - qa_blocked: true
  - validate_partial: true
  - reviewer_disagrees_with_validator: true
  - verify_yaml_changed: true
  - baseline_red: true
